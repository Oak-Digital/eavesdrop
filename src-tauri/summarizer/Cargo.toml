[package]
name = "eavesdrop-summarizer"
version = "0.1.15"
edition = "2024"
rust-version = "1.88"
description = "Out-of-process meeting summarizer for Eavesdrop"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
llama-cpp-2 = { version = "0.1.154", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metal here for the same reason as the app: the crate gates every backend
# behind a feature and defaults to none. This binary is the only thing in the
# bundle that links llama.cpp, so this is the only place it needs enabling.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["metal"] }
