name: Release desktop app

on:
  push:
    tags:
      - "v*.*.*"
  # Build the full matrix on demand without publishing anything, so a change
  # that only breaks one platform is found before a tag exists. The publish job
  # is skipped for this event; everything up to it runs exactly as on a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          config_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)
          test "$version" = "$config_version"
          test "$version" = "$cargo_version"
          # On workflow_dispatch the ref is a branch, so only a tag build has a
          # version to agree with.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: validate
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - name: Detect Apple distribution credentials
        id: apple_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=()
          for variable in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing an ad-hoc signed macOS build because Apple distribution secrets are missing: ${missing[*]}"
          fi
      - name: Import Developer ID certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/eavesdrop-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      # externalBin reads this binary rather than building it, so it has to exist
      # before Tauri runs. It links llama.cpp; the app links whisper.cpp.
      - name: Build the summary engine
        run: ./scripts/build-summarizer.sh universal-apple-darwin
      - name: Build Developer ID-signed macOS app
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app
      - name: Build ad-hoc signed macOS app
        if: steps.apple_signing.outputs.enabled != 'true'
        run: npm run tauri build -- --target universal-apple-darwin --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Notarize and staple macOS application
        if: steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/Eavesdrop.app"
          submission="$RUNNER_TEMP/Eavesdrop-notarization.zip"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          chmod 600 "$api_key_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Package signed macOS artifacts
        if: steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/Eavesdrop.app"
          output_dir="release"
          archive="$output_dir/Eavesdrop_${APP_VERSION}_universal.app.tar.gz"
          disk_image="$output_dir/Eavesdrop_${APP_VERSION}_universal.dmg"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$output_dir"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          tar -czf "$archive" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          npm run tauri signer sign -- --password "" "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$output_dir/Eavesdrop_${APP_VERSION}_universal.zip"
          hdiutil create -volname Eavesdrop -srcfolder "$app_path" -ov -format UDZO "$disk_image"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$disk_image"
          xcrun notarytool submit "$disk_image" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$disk_image"
          xcrun stapler validate "$disk_image"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$disk_image"
      - name: Package ad-hoc macOS artifacts
        if: steps.apple_signing.outputs.enabled != 'true'
        shell: bash
        run: |
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/Eavesdrop.app"
          output_dir="release"
          archive="$output_dir/Eavesdrop_${APP_VERSION}_universal.app.tar.gz"
          mkdir -p "$output_dir"
          ./scripts/sign-macos-local.sh "$app_path"
          tar -czf "$archive" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          npm run tauri signer sign -- --password "" "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$output_dir/Eavesdrop_${APP_VERSION}_universal.zip"
          hdiutil create -volname Eavesdrop -srcfolder "$app_path" -ov -format UDZO "$output_dir/Eavesdrop_${APP_VERSION}_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: eavesdrop-macos-${{ needs.validate.outputs.version }}
          path: release/*
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Build the summary engine
        shell: bash
        run: ./scripts/build-summarizer.sh x86_64-pc-windows-msvc
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi
      - name: Normalize Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $msi = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "Windows MSI was not produced" }
          $output = "release/Eavesdrop_${env:APP_VERSION}_x64_en-US.msi"
          Copy-Item $msi.FullName $output
          Copy-Item "$($msi.FullName).sig" "$output.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: eavesdrop-windows-${{ needs.validate.outputs.version }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [validate, build-macos, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: eavesdrop-*-${{ needs.validate.outputs.version }}
          path: release
          merge-multiple: true
      - name: Create signed update manifest
        run: node scripts/create-update-manifest.mjs "$APP_VERSION" "$GITHUB_REPOSITORY" release
      - name: Publish release
        shell: bash
        run: |
          tag="v$APP_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Eavesdrop $APP_VERSION"
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
